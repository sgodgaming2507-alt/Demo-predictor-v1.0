<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070914">
<title>NEXUS AI - Big Small</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  min-height:100vh;
  background:#050710;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 50% 0%,#171746 0%,transparent 42%),
    radial-gradient(circle at 15% 85%,#071d35 0%,transparent 40%);
}
.app{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:18px;
  position:relative;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:rgba(10,15,30,.8);
  border:1px solid #243b66;
  border-radius:14px;
  box-shadow:0 0 20px #00c8ff15;
}
.logo{
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
  color:#66eaff;
  text-shadow:0 0 15px #00c8ff;
}
.status{
  font-size:10px;
  letter-spacing:1px;
  color:#57ffb0;
}
.status:before{
  content:"● ";
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:.2}
}
.title{
  text-align:center;
  margin-top:24px;
  font-size:11px;
  letter-spacing:4px;
  color:#8296cb;
}
.subtitle{
  text-align:center;
  margin-top:7px;
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}
.subtitle span{
  color:#00eaff;
  text-shadow:0 0 15px #00eaff;
}

/* Reactor */
.reactor{
  height:260px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px auto;
}
.core{
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#16416a,#071226 65%);
  border:2px solid #00eaff;
  box-shadow:0 0 20px #00eaff, inset 0 0 25px #0077ff55;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  z-index:2;
  animation:corePulse 3s infinite ease-in-out;
}
.ring{
  position:absolute;
  border-radius:50%;
  border:2px solid transparent;
}
.r1{
  width:170px;height:170px;
  border-top-color:#00eaff;
  border-bottom-color:#00eaff;
  animation:spin 4s linear infinite;
}
.r2{
  width:205px;height:205px;
  border-left-color:#a100ff;
  border-right-color:#a100ff;
  animation:spinReverse 6s linear infinite;
}
.r3{
  width:235px;height:235px;
  border-top-color:#2455ff;
  border-bottom-color:#2455ff;
  animation:spin 8s linear infinite;
}
.orbit{
  position:absolute;
  width:250px;
  height:70px;
  border:1px solid #00cfff;
  border-radius:50%;
  transform:rotate(-18deg);
  box-shadow:0 0 12px #00cfff55;
}
.scanBeam{
  position:absolute;
  width:230px;
  height:2px;
  background:#00eaff;
  box-shadow:0 0 15px 4px #00eaff;
  opacity:0;
}
.scanning .scanBeam{
  opacity:1;
  animation:beamMove 1.4s ease-in-out infinite alternate;
}
@keyframes beamMove{
  from{transform:translateY(-95px)}
  to{transform:translateY(95px)}
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}
@keyframes corePulse{
  50%{box-shadow:0 0 40px #00eaff,inset 0 0 35px #0077ff88}
}

/* Analysis panel */
.panel{
  background:linear-gradient(145deg,#10172b,#080d1a);
  border:1px solid #263b68;
  border-radius:16px;
  padding:18px;
  box-shadow:0 0 20px #001e4455;
}
.panelTitle{
  font-size:11px;
  color:#8ba9d7;
  letter-spacing:2px;
  margin-bottom:16px;
  text-align:center;
}
.cards{
  display:flex;
  gap:12px;
}
.card{
  flex:1;
  min-height:130px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-radius:14px;
  position:relative;
  overflow:hidden;
  transition:.35s;
}
.big{
  border:1px solid #ffb52e;
  background:linear-gradient(145deg,#38240b,#120d09);
  color:#ffbf45;
}
.small{
  border:1px solid #00dfff;
  background:linear-gradient(145deg,#082b41,#07111e);
  color:#36e7ff;
}
.cardLabel{
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
  z-index:1;
}
.cardSub{
  font-size:9px;
  letter-spacing:2px;
  margin-top:10px;
  opacity:.7;
  z-index:1;
}
.big.active{
  animation:bigGlow 1.2s infinite alternate;
}
.small.active{
  animation:smallGlow 1.2s infinite alternate;
}
@keyframes bigGlow{
  from{box-shadow:0 0 5px #ffae2255}
  to{box-shadow:0 0 24px #ffae22aa}
}
@keyframes smallGlow{
  from{box-shadow:0 0 5px #00dfff55}
  to{box-shadow:0 0 24px #00dfffaa}
}

/* Scan progress */
.scanInfo{
  margin-top:20px;
  text-align:center;
}
.scanText{
  font-size:11px;
  letter-spacing:2px;
  color:#5feaff;
  min-height:17px;
}
.progress{
  width:100%;
  height:7px;
  background:#111b30;
  border-radius:20px;
  margin-top:12px;
  overflow:hidden;
  border:1px solid #23375d;
}
.progressFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#006aff,#00f5ff,#b400ff);
  box-shadow:0 0 12px #00eaff;
  transition:width .12s linear;
}
.percent{
  font-size:10px;
  color:#829bc7;
  margin-top:7px;
}

/* Button */
.btn{
  width:100%;
  margin-top:18px;
  border:none;
  border-radius:12px;
  padding:16px;
  background:linear-gradient(90deg,#064cff,#00bfff);
  color:white;
  font-size:14px;
  font-weight:900;
  letter-spacing:2px;
  box-shadow:0 0 18px #006eff66;
  cursor:pointer;
  transition:.2s;
}
.btn:active{
  transform:scale(.97);
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.reset{
  background:linear-gradient(90deg,#25144c,#5416a6);
  box-shadow:0 0 18px #8b00ff33;
}

/* Footer */
.footer{
  margin-top:16px;
  padding:14px;
  text-align:center;
  border:1px solid #1b2946;
  border-radius:12px;
  color:#64789e;
  font-size:10px;
  letter-spacing:1px;
  background:#090e1a;
}
.disclaimer{
  margin-top:12px;
  text-align:center;
  font-size:10px;
  color:#7785a1;
  line-height:1.6;
}

/* Stars */
.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background-image:
    radial-gradient(1px 1px at 15% 15%,#fff,transparent),
    radial-gradient(1px 1px at 85% 30%,#00eaff,transparent),
    radial-gradient(1px 1px at 60% 80%,#fff,transparent),
    radial-gradient(2px 2px at 35% 55%,#8855ff,transparent),
    radial-gradient(1px 1px at 90% 90%,#fff,transparent);
  background-size:220px 220px;
  animation:starMove 30s linear infinite;
}
@keyframes starMove{
  to{background-position:220px 220px}
}
</style>
</head>

<body>
<div class="stars"></div>

<div class="app">

  <div class="topbar">
    <div class="logo">NEXUS AI</div>
    <div class="status">SYSTEM ONLINE</div>
  </div>

  <div class="title">NEURAL INTERFACE</div>
  <div class="subtitle">BIG <span>/</span> SMALL</div>

  <div class="reactor" id="reactor">
    <div class="orbit"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core" id="core">✦</div>
    <div class="scanBeam"></div>
  </div>

  <div class="panel">
    <div class="panelTitle">BIG / SMALL VISUAL ANALYSIS</div>

    <div class="cards">
      <div class="card big" id="bigCard">
        <div class="cardLabel">BIG</div>
        <div class="cardSub">VISUAL MODE A</div>
      </div>

      <div class="card small" id="smallCard">
        <div class="cardLabel">SMALL</div>
        <div class="cardSub">VISUAL MODE B</div>
      </div>
    </div>

    <div class="scanInfo">
      <div class="scanText" id="scanText">SYSTEM IDLE — READY TO SCAN</div>
      <div class="progress">
        <div class="progressFill" id="progressFill"></div>
      </div>
      <div class="percent" id="percent">0%</div>
    </div>

    <button class="btn" id="scanButton" onclick="startScan()">
      ▶ START SCAN
    </button>

    <button class="btn reset" id="resetButton" onclick="resetScan()" style="display:none">
      ↻ RESET SYSTEM
    </button>
  </div>

  <div class="footer" id="footerText">
    NEXUS CORE · VISUAL SIMULATION
  </div>

  <div class="disclaimer">
    VISUAL DEMO ONLY · NO REAL PREDICTIONS · NO GAME SIGNALS
  </div>

</div>

<script>
const reactor = document.getElementById("reactor");
const core = document.getElementById("core");
const bigCard = document.getElementById("bigCard");
const smallCard = document.getElementById("smallCard");
const scanText = document.getElementById("scanText");
const progressFill = document.getElementById("progressFill");
const percent = document.getElementById("percent");
const scanButton = document.getElementById("scanButton");
const resetButton = document.getElementById("resetButton");
const footerText = document.getElementById("footerText");

let running = false;
let interval = null;
let progress = 0;

const stages = [
  {at:0, text:"INITIALIZING NEURAL CORE..."},
  {at:20, text:"LOADING VISUAL MODULES..."},
  {at:45, text:"SCANNING INTERFACE..."},
  {at:70, text:"PROCESSING ANIMATION..."},
  {at:90, text:"FINALIZING VISUALS..."}
];

function startScan(){
  if(running) return;

  running = true;
  progress = 0;

  scanButton.disabled = true;
  scanButton.textContent = "⟳ SCANNING...";
  resetButton.style.display = "none";

  reactor.classList.add("scanning");
  bigCard.classList.add("active");
  smallCard.classList.add("active");

  core.textContent = "⌘";
  footerText.textContent = "NEURAL CORE · ANIMATION RUNNING";

  interval = setInterval(()=>{
    progress += 1;

    progressFill.style.width = progress + "%";
    percent.textContent = progress + "%";

    for(let i = stages.length-1; i>=0; i--){
      if(progress >= stages[i].at){
        scanText.textContent = stages[i].text;
        break;
      }
    }

    if(progress >= 100){
      finishScan();
    }
  },45);
}

function finishScan(){
  clearInterval(interval);
  running = false;

  reactor.classList.remove("scanning");
  bigCard.classList.remove("active");
  smallCard.classList.remove("active");

  core.textContent = "✓";
  scanText.textContent = "VISUAL SIMULATION COMPLETE";
  percent.textContent = "100% — COMPLETE";

  scanButton.disabled = false;
  scanButton.style.display = "none";
  resetButton.style.display = "block";

  footerText.textContent = "NEXUS CORE · SIMULATION COMPLETE";
}

function resetScan(){
  clearInterval(interval);
  running = false;
  progress = 0;

  reactor.classList.remove("scanning");
  bigCard.classList.remove("active");
  smallCard.classList.remove("active");

  progressFill.style.width = "0%";
  percent.textContent = "0%";
  scanText.textContent = "SYSTEM IDLE — READY TO SCAN";

  core.textContent = "✦";

  scanButton.disabled = false;
  scanButton.style.display = "block";
  scanButton.textContent = "▶ START SCAN";

  resetButton.style.display = "none";
  footerText.textContent = "NEXUS CORE · VISUAL SIMULATION";
}
</script>

</body>
</html>
