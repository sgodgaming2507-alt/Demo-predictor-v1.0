<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WinGo 1Min Pro Predictor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-gradient: radial-gradient(circle at top, #111b33 0%, #050811 70%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(56, 189, 248, 0.18);
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --green: #22c55e;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    .app-wrapper {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header */
    .header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .header span {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      margin-top: 4px;
      display: block;
    }

    /* Timer Card */
    .timer-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .timer-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: linear-gradient(180deg, #38bdf8, #c084fc);
    }

    .timer-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #c084fc);
      width: var(--progress, 100%);
      transition: width 1s linear;
    }

    .info-block span {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: block;
      font-weight: 600;
    }

    .info-block strong {
      font-size: 14px;
      color: #ffffff;
      margin-top: 3px;
      display: block;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .countdown-box {
      text-align: right;
    }

    .countdown-box strong {
      font-size: 24px;
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }

    /* Predictor Box */
    .predictor-box {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(2, 132, 199, 0.15);
      position: relative;
      overflow: hidden;
    }

    .status-title {
      font-size: 11px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .signal-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .badge {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .color-green {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
    }

    .color-red {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
    }

    .size-badge {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .number-ball {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #475569, #0f172a);
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #94a3b8;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .stats-row {
      display: flex;
      gap: 10px;
    }

    .stat-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
      text-align: center;
    }

    .stat-box span { color: #94a3b8; display: block; font-weight: 500; }
    .stat-box strong { color: #4ade80; font-size: 14px; font-weight: 700; margin-top: 2px; display: block; }

    /* Sync Card */
    .sync-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .sync-title {
      font-size: 11px;
      color: #facc15;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      text-align: center;
    }

    .sync-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
    }

    .sync-btn {
      padding: 10px 0;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sync-btn:active {
      background: var(--accent-cyan);
      color: #070a14;
      transform: scale(0.92);
    }

    /* History Card */
    .history-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .history-title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      color: #64748b;
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-win { color: #4ade80; font-weight: 800; }
    .tag-loss { color: #f87171; font-weight: 800; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Header -->
    <div class="header">
      <h1>WinGo Pro Predictor</h1>
      <span>AI Neural Engine v3.0</span>
    </div>

    <!-- Timer Card -->
    <div class="timer-card" id="timerCard">
      <div class="info-block">
        <span>Active Period</span>
        <strong id="periodNumber">Loading...</strong>
      </div>
      <div class="info-block countdown-box">
        <span>Time Left</span>
        <strong id="countdown">00:60</strong>
      </div>
    </div>

    <!-- Predictor Box -->
    <div class="predictor-box">
      <div class="status-title">✦ Live Signal Locked ✦</div>
      <div class="signal-display" id="signalDisplay">
        <div id="predColor" class="badge color-green">--</div>
        <div id="predSize" class="badge size-badge">--</div>
        <div id="predNumber" class="number-ball">-</div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <span>Confidence</span>
          <strong id="confScore">92.4%</strong>
        </div>
        <div class="stat-box">
          <span>Accuracy Rate</span>
          <strong id="accuracyRate">0%</strong>
        </div>
      </div>
    </div>

    <!-- Sync / Verification Panel -->
    <div class="sync-card">
      <div class="sync-title">Tap Real Result (Verify Match)</div>
      <div class="sync-grid">
        <button class="sync-btn" onclick="submitActualResult(0)">0</button>
        <button class="sync-btn" onclick="submitActualResult(1)">1</button>
        <button class="sync-btn" onclick="submitActualResult(2)">2</button>
        <button class="sync-btn" onclick="submitActualResult(3)">3</button>
        <button class="sync-btn" onclick="submitActualResult(4)">4</button>
        <button class="sync-btn" onclick="submitActualResult(5)">5</button>
        <button class="sync-btn" onclick="submitActualResult(6)">6</button>
        <button class="sync-btn" onclick="submitActualResult(7)">7</button>
        <button class="sync-btn" onclick="submitActualResult(8)">8</button>
        <button class="sync-btn" onclick="submitActualResult(9)">9</button>
      </div>
    </div>

    <!-- History Logs -->
    <div class="history-card">
      <div class="history-title">Verification Logs</div>
      <table>
        <thead>
          <tr>
            <th>Period</th>
            <th>Predicted</th>
            <th>Actual</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let lastPeriod = "";
    let currentPrediction = null;
    let totalMatches = 0;
    let totalWins = 0;

    function get1MinPeriodId() {
      const now = new Date();
      const year = now.getUTCFullYear();
      const month = String(now.getUTCMonth() + 1).padStart(2, '0');
      const day = String(now.getUTCDate()).padStart(2, '0');
      
      const totalMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
      const periodIndex = 10001 + totalMinutes;
      
      return `${year}${month}${day}10001${String(totalMinutes).padStart(4, '0')}`;
    }

    function getDynamicSignal(periodStr) {
      const randomSeed = Math.floor(Math.random() * 1000) + Date.now() % 97;
      let hash = randomSeed;
      for (let i = 0; i < periodStr.length; i++) {
        hash = ((hash << 5) - hash) + periodStr.charCodeAt(i) + i;
        hash |= 0;
      }
      const absHash = Math.abs(hash);
      const digit = absHash % 10;
      const isGreen = [1, 3, 5, 7, 9].includes(digit);
      const isBig = digit >= 5;
      const confidence = (87 + (absHash % 9)).toFixed(1);

      return {
        digit,
        colorText: isGreen ? "GREEN" : "RED",
        isGreen,
        sizeText: isBig ? "BIG" : "SMALL",
        confidence
      };
    }

    function updateTimerAndSync() {
      const now = new Date();
      const secondsLeft = 60 - now.getUTCSeconds();
      const displaySec = secondsLeft === 60 ? 60 : secondsLeft;
      
      document.getElementById("countdown").textContent = `00:${String(displaySec).padStart(2, '0')}`;
      document.getElementById("timerCard").style.setProperty('--progress', `${(displaySec / 60) * 100}%`);

      const currentPeriod = get1MinPeriodId();
      document.getElementById("periodNumber").textContent = currentPeriod;

      if (lastPeriod !== currentPeriod) {
        lastPeriod = currentPeriod;
        currentPrediction = getDynamicSignal(currentPeriod);

        const colorEl = document.getElementById("predColor");
        const sizeEl = document.getElementById("predSize");
        const numEl = document.getElementById("predNumber");
        const display = document.getElementById("signalDisplay");

        colorEl.textContent = currentPrediction.colorText;
        colorEl.className = "badge " + (currentPrediction.isGreen ? "color-green" : "color-red");
        sizeEl.textContent = currentPrediction.sizeText;
        numEl.textContent = currentPrediction.digit;
        document.getElementById("confScore").textContent = `${currentPrediction.confidence}%`;

        // Trigger smooth re-animation on update
        display.style.animation = 'none';
        display.offsetHeight;
        display.style.animation = 'popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
      }
    }

    function submitActualResult(actualNum) {
      if (!currentPrediction) return;

      const isWin = (actualNum === currentPrediction.digit);
      totalMatches++;
      if (isWin) totalWins++;

      const accuracy = Math.round((totalWins / totalMatches) * 100);
      document.getElementById("accuracyRate").textContent = `${accuracy}%`;

      const tbody = document.getElementById("historyBody");
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>#${lastPeriod.slice(-4)}</td>
        <td>${currentPrediction.digit} (${currentPrediction.sizeText[0]})</td>
        <td><strong>${actualNum}</strong> (${actualNum >= 5 ? 'B' : 'S'})</td>
        <td><span class="${isWin ? 'tag-win' : 'tag-loss'}">${isWin ? 'WIN' : 'LOSS'}</span></td>
      `;

      tbody.insertBefore(row, tbody.firstChild);
      if (tbody.children.length > 5) tbody.removeChild(tbody.lastChild);
    }

    updateTimerAndSync();
    setInterval(updateTimerAndSync, 1000);
  </script>

</body>
</html>
