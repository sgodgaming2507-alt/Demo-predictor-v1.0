<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WinGo 1Min Pro Predictor</title>
  <style>
    :root {
      --bg-dark: #070a14;
      --card-bg: #111827;
      --border-glow: rgba(56, 189, 248, 0.4);
      --green: #22c55e;
      --red: #ef4444;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      background: var(--card-bg);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .header h1 {
      font-size: 17px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .header span {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .timer-card {
      background: var(--card-bg);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .timer-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      width: var(--progress, 100%);
      transition: width 1s linear;
    }

    .info-block span {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      display: block;
    }

    .info-block strong {
      font-size: 13px;
      color: #f8fafc;
      margin-top: 4px;
      display: block;
      font-variant-numeric: tabular-nums;
    }

    .countdown-box {
      text-align: right;
    }

    .countdown-box strong {
      font-size: 24px;
      color: #facc15;
    }

    .predictor-box {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(2, 132, 199, 0.2);
    }

    .status-title {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .signal-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .badge {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .color-green {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .color-red {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .size-badge {
      background-color: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid #0284c7;
    }

    .number-ball {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #334155;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #64748b;
    }

    .stats-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .stat-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      font-size: 11px;
      text-align: center;
    }

    .stat-box span { color: #9ca3af; display: block; }
    .stat-box strong { color: #4ade80; font-size: 13px; }

    .sync-card {
      background: var(--card-bg);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
    }

    .sync-title {
      font-size: 11px;
      color: #facc15;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sync-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }

    .sync-btn {
      padding: 8px 0;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .sync-btn:active { background: #38bdf8; color: #000; }

    .history-card {
      background: var(--card-bg);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
    }

    .history-title {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    th, td {
      padding: 7px 4px;
      text-align: center;
      border-bottom: 1px solid #1f2937;
    }

    th {
      color: #6b7280;
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
    }

    .tag-win { color: #4ade80; font-weight: 700; }
    .tag-loss { color: #f87171; font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="header">
      <h1>WinGo 1Min Predictor</h1>
      <span>1-Minute Locked Engine</span>
    </div>

    <div class="timer-card" id="timerCard">
      <div class="info-block">
        <span>Active Period (1Min)</span>
        <strong id="periodNumber">Loading...</strong>
      </div>
      <div class="info-block countdown-box">
        <span>Time Left</span>
        <strong id="countdown">00:60</strong>
      </div>
    </div>

    <div class="predictor-box">
      <div class="status-title">Current 1Min Locked Signal</div>
      <div class="signal-display">
        <div id="predColor" class="badge color-green">--</div>
        <div id="predSize" class="badge size-badge">--</div>
        <div id="predNumber" class="number-ball">-</div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <span>Confidence</span>
          <strong id="confScore">90.5%</strong>
        </div>
        <div class="stat-box">
          <span>Accuracy Rate</span>
          <strong id="accuracyRate">0%</strong>
        </div>
      </div>
    </div>

    <div class="sync-card">
      <div class="sync-title">Tap Real 1Min Result (Verify Match)</div>
      <div class="sync-grid">
        <button class="sync-btn" onclick="submitActualResult(0)">0</button>
        <button class="sync-btn" onclick="submitActualResult(1)">1</button>
        <button class="sync-btn" onclick="submitActualResult(2)">2</button>
        <button class="sync-btn" onclick="submitActualResult(3)">3</button>
        <button class="sync-btn" onclick="submitActualResult(4)">4</button>
        <button class="sync-btn" onclick="submitActualResult(5)">5</button>
        <button class="sync-btn" onclick="submitActualResult(6)">6</button>
        <button class="sync-btn" onclick="submitActualResult(7)">7</button>
        <button class="sync-btn" onclick="submitActualResult(8)">8</button>
        <button class="sync-btn" onclick="submitActualResult(9)">9</button>
      </div>
    </div>

    <div class="history-card">
      <div class="history-title">1Min Verification Logs</div>
      <table>
        <thead>
          <tr>
            <th>Period</th>
            <th>Predicted</th>
            <th>Actual</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let lastPeriod = "";
    let currentPrediction = null;
    let totalMatches = 0;
    let totalWins = 0;

    // 1-Minute Period Formula matching exact game format (YYYYMMDD10001XXXX)
    function get1MinPeriodId() {
      const now = new Date();
      const year = now.getUTCFullYear();
      const month = String(now.getUTCMonth() + 1).padStart(2, '0');
      const day = String(now.getUTCDate()).padStart(2, '0');
      
      const totalMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
      const periodIndex = 10001 + totalMinutes;
      
      return `${year}${month}${day}10001${String(totalMinutes).padStart(4, '0')}`;
    }

    function getAdvancedSignal(periodStr) {
      let hash = 0;
      for (let i = 0; i < periodStr.length; i++) {
        hash = ((hash << 5) - hash) + periodStr.charCodeAt(i);
        hash |= 0;
      }
      const absHash = Math.abs(hash);
      const subSeed = (absHash * 9301 + 49297) % 233280;
      const rnd = subSeed / 233280;

      const digit = Math.floor(rnd * 10);
      const isGreen = [1, 3, 5, 7, 9].includes(digit);
      const isBig = digit >= 5;
      const confidence = (86 + (absHash % 9) + (rnd * 4)).toFixed(1);

      return {
        digit,
        colorText: isGreen ? "GREEN" : "RED",
        isGreen,
        sizeText: isBig ? "BIG" : "SMALL",
        confidence
      };
    }

    function updateTimerAndSync() {
      const now = new Date();
      const secondsLeft = 60 - now.getUTCSeconds();
      const displaySec = secondsLeft === 60 ? 60 : secondsLeft;
      
      document.getElementById("countdown").textContent = `00:${String(displaySec).padStart(2, '0')}`;
      document.getElementById("timerCard").style.setProperty('--progress', `${(displaySec / 60) * 100}%`);

      const currentPeriod = get1MinPeriodId();
      document.getElementById("periodNumber").textContent = currentPeriod;

      if (lastPeriod !== currentPeriod) {
        lastPeriod = currentPeriod;
        currentPrediction = getAdvancedSignal(currentPeriod);

        const colorEl = document.getElementById("predColor");
        const sizeEl = document.getElementById("predSize");
        const numEl = document.getElementById("predNumber");

        colorEl.textContent = currentPrediction.colorText;
        colorEl.className = "badge " + (currentPrediction.isGreen ? "color-green" : "color-red");
        sizeEl.textContent = currentPrediction.sizeText;
        numEl.textContent = currentPrediction.digit;
        document.getElementById("confScore").textContent = `${currentPrediction.confidence}%`;
      }
    }

    function submitActualResult(actualNum) {
      if (!currentPrediction) return;

      const isWin = (actualNum === currentPrediction.digit);
      totalMatches++;
      if (isWin) totalWins++;

      const accuracy = Math.round((totalWins / totalMatches) * 100);
      document.getElementById("accuracyRate").textContent = `${accuracy}%`;

      const tbody = document.getElementById("historyBody");
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>#${lastPeriod.slice(-4)}</td>
        <td>${currentPrediction.digit} (${currentPrediction.sizeText[0]})</td>
        <td><strong>${actualNum}</strong> (${actualNum >= 5 ? 'B' : 'S'})</td>
        <td><span class="${isWin ? 'tag-win' : 'tag-loss'}">${isWin ? 'WIN' : 'LOSS'}</span></td>
      `;

      tbody.insertBefore(row, tbody.firstChild);
      if (tbody.children.length > 5) tbody.removeChild(tbody.lastChild);
    }

    updateTimerAndSync();
    setInterval(updateTimerAndSync, 1000);
  </script>

</body>
</html>
