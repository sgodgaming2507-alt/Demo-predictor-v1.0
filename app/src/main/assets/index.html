
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#050713;color:#fff;font-family:Arial,sans-serif;
 min-height:100vh;overflow-x:hidden;
 background-image:radial-gradient(ellipse at center,#121c43 0%,#050713 70%);
}
.app{max-width:480px;margin:auto;padding:16px}
.top{
 display:flex;justify-content:space-between;align-items:center;
 padding:15px;border:1px solid #17426b;border-radius:14px;
 background:#091326;box-shadow:0 0 18px #00d9ff15;
}
.logo{font-size:20px;font-weight:900;letter-spacing:2px;color:#00eaff}
.online{font-size:10px;color:#47ff9a}
.heading{text-align:center;margin-top:24px;letter-spacing:4px;color:#92a6cf;font-size:11px}
.sub{text-align:center;margin-top:8px;font-size:23px;font-weight:bold}
.sub span{color:#00eaff}
.demo{text-align:center;color:#9c85ff;font-size:10px;letter-spacing:2px;margin-top:8px}

/* CIRCLE CORE */
.reactor{
 height:330px;display:flex;align-items:center;justify-content:center;
 position:relative;margin:12px 0;
}
.orbit,.ring{
 position:absolute;border-radius:50%;pointer-events:none
}
.orbit{
 width:300px;height:105px;border:1px solid #00cfff;
 transform:rotate(-25deg);box-shadow:0 0 12px #00cfff55;
}
.orbit.two{
 transform:rotate(35deg);border-color:#a000ff;
 box-shadow:0 0 12px #a000ff55;
}
.ring.one{
 width:260px;height:260px;border:2px dashed #00cfff88;
 animation:rotate 12s linear infinite;
}
.ring.two{
 width:235px;height:235px;border:2px solid transparent;
 border-top-color:#00eaff;border-bottom-color:#a400ff;
 animation:rotate 5s linear infinite reverse;
}
.ring.three{
 width:205px;height:205px;border:1px solid #a900ff;
 box-shadow:0 0 16px #8b00ff33,inset 0 0 15px #8b00ff22;
 animation:rotate 8s linear infinite;
}
.core{
 width:178px;height:178px;border-radius:50%;
 border:2px solid #00dfff;
 background:radial-gradient(circle,#101e39,#050914 70%);
 box-shadow:0 0 25px #00dfff55,inset 0 0 25px #00dfff22;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;z-index:2;position:relative;
}
.scanbeam{
 position:absolute;width:175px;height:2px;
 background:#00eaff;box-shadow:0 0 15px 3px #00eaff;
 opacity:0;z-index:4;pointer-events:none
}
.scanning .scanbeam{opacity:1;animation:beam 1s ease-in-out infinite alternate}
@keyframes beam{from{transform:translateY(-80px)}to{transform:translateY(80px)}}
@keyframes rotate{to{transform:rotate(360deg)}}
.coretitle{font-size:9px;color:#6eeaff;letter-spacing:2px}
.demoBig{
 font-size:32px;font-weight:900;letter-spacing:3px;
 margin:6px 0;text-shadow:0 0 16px currentColor;
 color:#ffb52e;
}
.demoColor{font-size:13px;color:#39ff82;font-weight:bold;letter-spacing:2px}
.demoNumber{font-size:27px;color:#bb65ff;font-weight:900;text-shadow:0 0 16px #bb65ff}
.miniLabel{font-size:8px;color:#8097bb;letter-spacing:2px;margin-top:5px}
.scanning .core{animation:pulse .7s infinite alternate}
@keyframes pulse{
 to{box-shadow:0 0 45px #00dfff,inset 0 0 35px #00dfff66}
}

/* PANEL */
.panel{
 border:1px solid #1b4164;border-radius:15px;
 padding:16px;background:linear-gradient(145deg,#10192d,#080d19);
}
.label{text-align:center;color:#7e9ac4;font-size:10px;letter-spacing:2px}
.statusText{text-align:center;margin-top:12px;color:#00eaff;font-size:11px}
.bar{height:6px;background:#172238;border-radius:10px;margin-top:12px;overflow:hidden}
.fill{
 height:100%;width:0%;
 background:linear-gradient(90deg,#175bff,#00eaff,#a000ff);
 box-shadow:0 0 10px #00eaff;
}
.percent{text-align:center;font-size:10px;color:#8295b5;margin-top:7px}
button{
 width:100%;padding:15px;margin-top:15px;border:0;border-radius:11px;
 background:linear-gradient(90deg,#0757ff,#00cfff);
 color:white;font-weight:900;letter-spacing:2px;font-size:13px;
 box-shadow:0 0 20px #006eff44;
}
button:disabled{opacity:.5}
.reset{background:linear-gradient(90deg,#5015ad,#a000ff)}
.footer{
 margin-top:15px;text-align:center;padding:14px;border:1px solid #192a46;
 border-radius:12px;color:#8293b5;font-size:10px;letter-spacing:1px;
}
.note{text-align:center;color:#667997;font-size:9px;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div class="app">

<div class="top">
 <div class="logo">NEXUS AI</div>
 <div class="online">● SYSTEM ONLINE</div>
</div>

<div class="heading">NEURAL INTERFACE</div>
<div class="sub">BIG <span>/</span> SMALL</div>
<div class="demo">VISUAL SIMULATION</div>

<!-- SAME CIRCULAR DESIGN -->
<div class="reactor" id="reactor">
 <div class="orbit"></div>
 <div class="orbit two"></div>
 <div class="ring one"></div>
 <div class="ring two"></div>
 <div class="ring three"></div>

 <div class="core" id="core">
  <div class="coretitle">DEMO SAMPLE</div>
  <div class="demoBig" id="bigSmall">BIG</div>
  <div class="demoColor" id="color">GREEN</div>
  <div class="miniLabel">NUMBER</div>
  <div class="demoNumber" id="number">7</div>
 </div>
 <div class="scanbeam"></div>
</div>

<div class="panel">
 <div class="label">NEXUS VISUAL ENGINE</div>
 <div class="statusText" id="status">SYSTEM IDLE</div>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <div class="percent" id="percent">READY</div>
 <button id="scanBtn" onclick="startScan()">▶ START SCAN</button>
 <button class="reset" id="resetBtn" onclick="resetScan()" style="display:none">↻ RESET</button>
</div>

<div class="footer" id="footer">
NEXUS CORE · DEMO MODE
</div>
<div class="note">
VISUAL SIMULATION ONLY · SAMPLE VALUES ARE FIXED<br>
NOT A REAL GAME PREDICTION
</div>
</div>

<script>
const reactor=document.getElementById("reactor");
const status=document.getElementById("status");
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");
const scanBtn=document.getElementById("scanBtn");
const resetBtn=document.getElementById("resetBtn");
const footer=document.getElementById("footer");

let running=false;
let progress=0;
let timer=null;

const messages=[
 "INITIALIZING CORE...",
 "LOADING NEURAL UI...",
 "RUNNING VISUAL SCAN...",
 "PROCESSING DEMO...",
 "SCAN COMPLETE"
];

function startScan(){
 if(running)return;
 running=true;
 progress=0;
 scanBtn.disabled=true;
 scanBtn.innerText="⟳ SCANNING...";
 reactor.classList.add("scanning");
 footer.innerText="NEXUS CORE · ANIMATION ACTIVE";

 timer=setInterval(()=>{
  progress+=2;
  if(progress>100)progress=100;
  fill.style.width=progress+"%";
  percent.innerText=progress+"%";

  let index=Math.min(4,Math.floor(progress/25));
  status.innerText=messages[index];

  if(progress>=100)finish();
 },50);
}

function finish(){
 clearInterval(timer);
 running=false;
 reactor.classList.remove("scanning");
 status.innerText="DEMO ANIMATION COMPLETE";
 percent.innerText="100% · COMPLETE";
 scanBtn.style.display="none";
 resetBtn.style.display="block";
 footer.innerText="NEXUS CORE · DEMO FINISHED";
}

function resetScan(){
 clearInterval(timer);
 running=false;
 progress=0;
 reactor.classList.remove("scanning");
 fill.style.width="0%";
 percent.innerText="READY";
 status.innerText="SYSTEM IDLE";
 scanBtn.disabled=false;
 scanBtn.innerText="▶ START SCAN";
 scanBtn.style.display="block";
 resetBtn.style.display="none";
 footer.innerText="NEXUS CORE · DEMO MODE";
}
</script>
</body>
</html>
