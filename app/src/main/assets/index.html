<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinGo Pro Predictor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --blue:#35caff;
 --purple:#9b65ff;
 --red:#ff416b;
 --green:#30e99a;
 --bg:#050914;
}
body{
 background:var(--bg);
 color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
 overflow-x:hidden;
 padding:20px 14px 40px;
}
body:before{
 content:"";
 position:fixed;inset:0;z-index:-2;
 background:
 radial-gradient(ellipse at 20% 10%,#182c55 0%,transparent 45%),
 radial-gradient(ellipse at 90% 50%,#241344 0%,transparent 40%),
 #050914;
}
#particles{
 position:fixed;inset:0;z-index:-1;
 pointer-events:none;
}
.particle{
 position:absolute;width:3px;height:3px;
 background:#48cfff;border-radius:50%;
 box-shadow:0 0 12px #35caff;
 animation:float linear infinite;
}
@keyframes float{
 from{transform:translateY(105vh);opacity:0}
 20%{opacity:.8}
 to{transform:translateY(-10vh);opacity:0}
}
.container{max-width:480px;margin:auto}
.header{
 margin-top:100px;
 padding:22px 10px;
 text-align:center;
 border:1px solid #263e61;
 border-radius:22px;
 background:linear-gradient(135deg,#131e32,#101426);
 box-shadow:0 0 30px #2775ff16,inset 0 0 20px #ffffff05;
 animation:entrance .8s ease;
}
.logo{
 font-size:22px;font-weight:900;
 background:linear-gradient(90deg,#36d8ff,#a18aff,#36d8ff);
 background-size:200%;
 color:transparent;
 background-clip:text;
 animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200%}}
.sub{color:#8594b0;font-size:11px;letter-spacing:3px;margin-top:7px}
.card{
 margin-top:16px;
 padding:20px;
 border-radius:23px;
 background:linear-gradient(145deg,#141f32,#101525);
 border:1px solid #273c5b;
 box-shadow:0 10px 35px #0005,inset 0 0 20px #ffffff04;
 position:relative;overflow:hidden;
 animation:entrance .8s ease both;
}
.card:before{
 content:"";position:absolute;
 top:0;left:-100%;width:70%;height:1px;
 background:linear-gradient(90deg,transparent,#40cfff,transparent);
 animation:scan 4s linear infinite;
}
@keyframes scan{to{left:130%}}
@keyframes entrance{
 from{opacity:0;transform:translateY(25px)}
 to{opacity:1;transform:translateY(0)}
}
.period{
 display:flex;justify-content:space-between;align-items:center;
}
.muted{color:#8998b0;font-size:11px;font-weight:bold;letter-spacing:1px}
.period-no{font-size:15px;font-weight:800;margin-top:7px}
.timer{
 color:#ffdc38;font-size:27px;font-weight:900;
 text-shadow:0 0 18px #ffce35;
}
.progress{
 height:4px;background:#222b40;
 border-radius:10px;margin-top:16px;overflow:hidden;
}
.progress span{
 display:block;height:100%;width:50%;
 background:linear-gradient(90deg,#35caff,#ae69ff);
 box-shadow:0 0 12px #35caff;
 transition:width 1s linear;
}
.signal{text-align:center;padding:23px 12px}
.live{
 color:#45caff;font-size:12px;font-weight:bold;
 letter-spacing:2px;
 animation:pulse 1.5s infinite;
}
@keyframes pulse{
 50%{opacity:.45;text-shadow:0 0 20px #36caff}
}
.signals{
 display:flex;justify-content:center;align-items:center;
 gap:13px;margin:20px 0;
}
.tag{
 padding:12px 20px;border-radius:13px;
 font-size:18px;font-weight:900;
 border:1px solid;
 animation:glow 2s infinite alternate;
}
.red{color:#ff647e;border-color:#a63858;background:#ff345b18;box-shadow:0 0 20px #ff345b24}
.big{color:#40caff;border-color:#25668d;background:#24baff18;box-shadow:0 0 20px #24baff24}
.number{
 width:58px;height:58px;border-radius:50%;
 display:grid;place-items:center;
 font-size:26px;font-weight:900;
 border:3px solid #8294ae;
 background:radial-gradient(circle at 30% 20%,#65748a,#192337 65%);
 box-shadow:0 0 22px #7b9fff50,inset 0 0 15px #fff2;
 animation:rotateIn .7s ease,numberGlow 2s infinite alternate;
}
@keyframes rotateIn{
 from{transform:rotateY(180deg) scale(.4);opacity:0}
 to{transform:rotateY(0) scale(1);opacity:1}
}
@keyframes numberGlow{
 to{box-shadow:0 0 35px #4bbaff80,inset 0 0 20px #fff4}
}
@keyframes glow{to{filter:brightness(1.4)}}
.stats{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.stat{
 text-align:center;padding:13px;
 border-radius:14px;background:#101a2c;
 border:1px solid #202e46;
}
.stat small{display:block;color:#8b9ab2;font-size:11px}
.stat strong{display:block;color:var(--green);margin-top:5px;font-size:15px}
.section-title{
 text-align:center;color:#ffdc38;
 font-size:12px;font-weight:900;letter-spacing:1px;
 margin-bottom:16px;
}
.digits{
 display:grid;grid-template-columns:repeat(10,1fr);gap:5px;
}
.digit{
 padding:12px 0;border-radius:10px;
 background:linear-gradient(145deg,#202d42,#131d2d);
 color:white;border:1px solid #2a3c56;
 font-size:13px;font-weight:bold;
 cursor:pointer;transition:.25s;
}
.digit:active{transform:scale(.85)}
.digit:hover{border-color:#40caff;box-shadow:0 0 15px #35caff55}
.logs{margin-top:18px}
.logrow{
 display:grid;grid-template-columns:1fr 1fr 1fr 1fr;
 padding:12px 0;text-align:center;
 font-size:11px;color:#a8b7d0;
 border-bottom:1px solid #27334a;
 animation:entrance .4s ease;
}
.loghead{color:#74849e;font-weight:bold}
.empty{color:#64738c;text-align:center;padding:18px;font-size:12px}
.footer{text-align:center;margin-top:22px;color:#65738b;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="particles"></div>
<div class="container">

<div class="header">
 <div class="logo">✦ WinGo Pro Predictor ✦</div>
 <div class="sub">AI NEURAL INTERFACE V4.0</div>
</div>

<div class="card">
 <div class="period">
  <div>
   <div class="muted">ACTIVE PERIOD</div>
   <div class="period-no" id="period">2026111900010286</div>
  </div>
  <div style="text-align:right">
   <div class="muted">TIME LEFT</div>
   <div class="timer" id="timer">00:30</div>
  </div>
 </div>
 <div class="progress"><span id="bar"></span></div>
</div>

<div class="card signal">
 <div class="live">✦ LIVE SIGNAL SYSTEM ✦</div>
 <div class="signals">
  <div class="tag red" id="color">RED</div>
  <div class="tag big" id="size">BIG</div>
  <div class="number" id="number">6</div>
 </div>
 <div class="stats">
  <div class="stat">
   <small>DEMO SIGNAL</small>
   <strong>ACTIVE</strong>
  </div>
  <div class="stat">
   <small>VERIFIED RESULTS</small>
   <strong id="count">0</strong>
  </div>
 </div>
</div>

<div class="card">
 <div class="section-title">TAP REAL RESULT (VERIFY MATCH)</div>
 <div class="digits" id="digits"></div>
</div>

<div class="card logs">
 <div class="muted" style="margin-bottom:18px">VERIFICATION LOGS</div>
 <div class="logrow loghead">
  <span>PERIOD</span><span>DEMO</span>
  <span>ACTUAL</span><span>STATUS</span>
 </div>
 <div id="history">
  <div class="empty">AWAITING RESULT INPUT...</div>
 </div>
</div>

<div class="footer">WIN GO PRO • NEURAL UI V4.0</div>
</div>

<script>
const particleBox=document.getElementById('particles');
for(let i=0;i<35;i++){
 const p=document.createElement('div');
 p.className='particle';
 p.style.left=Math.random()*100+'%';
 p.style.animationDuration=(6+Math.random()*12)+'s';
 p.style.animationDelay=(-Math.random()*15)+'s';
 particleBox.appendChild(p);
}

let time=30;
let period=286;
let verified=0;
let demoNumber=6;

const $=id=>document.getElementById(id);

function updateTimer(){
 time--;
 if(time<0){
  time=30;
  period++;
  $('period').textContent='2026111900010'+period;
  demoNumber=Math.floor(Math.random()*10);
  updateSignal();
 }
 $('timer').textContent='00:'+String(time).padStart(2,'0');
 $('bar').style.width=(time/30*100)+'%';
}
setInterval(updateTimer,1000);

function updateSignal(){
 const n=demoNumber;
 $('number').textContent=n;
 $('number').style.animation='none';
 void $('number').offsetWidth;
 $('number').style.animation='rotateIn .7s ease,numberGlow 2s infinite alternate';
 $('color').textContent=n%2===0?'RED':'GREEN';
 $('color').className='tag '+(n%2===0?'red':'big');
 $('size').textContent=n>=5?'BIG':'SMALL';
}
updateSignal();

const digits=$('digits');
for(let i=0;i<10;i++){
 const b=document.createElement('button');
 b.className='digit';
 b.textContent=i;
 b.onclick=()=>addResult(i);
 digits.appendChild(b);
}

function addResult(n){
 verified++;
 $('count').textContent=verified;
 const row=document.createElement('div');
 row.className='logrow';
 const status=n===demoNumber?'MATCH':'NO MATCH';
 row.innerHTML=
 '<span>'+period+'</span>'+
 '<span>'+demoNumber+'</span>'+
 '<span>'+n+'</span>'+
 '<span style="color:'+(status==='MATCH'?'#30e99a':'#ff647e')+'">'+status+'</span>';
 const history=$('history');
 if(history.querySelector('.empty'))history.innerHTML='';
 history.prepend(row);
 while(history.children.length>8)history.lastElementChild.remove();
}
</script>
</body>
</html>
